<!--
    Act As - роль сонгох modal (coder, system_rbac эсвэл 2+ ролтой хэрэглэгч;
    roles нь JWTAuthMiddleware::canActAs()-аар шүүгдсэн)

    Variables:
      roles    - alias-аар бүлэглэсэн роль (id, alias, name, description)
      lifetime - Act As горимын хугацаа (минут)
-->

<div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" role="document">
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title fs-6 text-warning">
                <i class="bi bi-incognito"></i> {{ 'act-as'|text }}
            </h3>
            <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="{{ 'close'|text }}"></button>
        </div>
        <form id="act_as_form" action="{{ 'act-as-start'|link }}" method="POST" class="modal-body">
            <p class="small text-muted">
                {{ 'act-as-hint'|text }} ({{ lifetime }} min)
            </p>
            {% for alias, items in roles %}
                <h6 class="fw-bold mt-3 mb-2 text-uppercase small">{{ alias }}</h6>
                <div class="list-group">
                    {% for role in items %}
                    <label class="list-group-item list-group-item-action d-flex align-items-start">
                        <input class="form-check-input me-2 mt-1" type="radio" name="role_id" value="{{ role['id'] }}" required>
                        <span>
                            <code>{{ role['alias'] }}_{{ role['name'] }}</code>
                            {% if role['description'] is not empty %}
                                <span class="d-block small text-muted">{{ role['description'] }}</span>
                            {% endif %}
                        </span>
                    </label>
                    {% endfor %}
                </div>
            {% else %}
                <div class="alert alert-secondary mb-0">{{ 'no-results-found'|text }}</div>
            {% endfor %}
        </form>
        <div class="modal-footer">
            <button class="btn btn-secondary shadow-sm" type="button" data-bs-dismiss="modal">{{ 'cancel'|text }}</button>
            {% if roles is not empty %}
            <button class="btn btn-warning shadow-sm submit-act-as" type="button">
                <i class="bi bi-incognito"></i> {{ 'act-as'|text }}
            </button>
            {% endif %}
        </div>
    </div>
</div>
<script type="text/javascript">
    /* Роль сонгоод Act As горимыг эхлүүлнэ -> амжилттай бол dashboard home руу
       шилжинэ (одоогийн хуудас тэр рольд хаалттай байж болно) */
    const actAsForm = document.querySelector('form#act_as_form');
    const actAsSubmit = document.querySelector('button.submit-act-as');
    if (actAsForm && actAsSubmit) {
        actAsSubmit.addEventListener('click', function (e) {
            e.preventDefault();
            actAsForm.requestSubmit();
        });
        actAsForm.addEventListener('submit', function (event) {
            event.preventDefault();
            if (!this.checkValidity()) {
                return Notify('warning', `{{ 'act-as'|text|e('js') }}`, `{{ 'role'|text|e('js') }}?`);
            }
            actAsSubmit.growNstop();
            csrfFetch(this.action, {method: 'POST', body: new FormData(this)})
                .then(res => res.json())
                .then(response => {
                    if (response.status !== 'success') {
                        throw new Error(response.message ?? 'Invalid response!');
                    }
                    window.location.href = `{{ 'home'|link|e('js') }}`;
                })
                .catch(error => {
                    Notify('danger', `{{ 'error'|text|e('js') }}`, error.message);
                    actAsSubmit.growNstop();
                });
        });
    }
</script>
