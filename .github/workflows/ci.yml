# ======================================================================
# CI - Code Quality Checks
# ======================================================================
#
# Push болон pull request бүрт код чанарын шалгалт хийнэ.
#
# Шалгалтууд:
#   - composer.json validation
#   - PHP syntax check
#   - Merge conflict markers
#   - Debug statements (var_dump, dd, print_r)
#   - Autoload verification
#   - PHPUnit Unit test suite (Integration suite нь DB шаарддаг тул энд ажиллахгүй)
# ======================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, intl, pdo_mysql

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction

      - name: PHP syntax check
        run: find application public_html -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Check for merge conflict markers
        run: |
          if grep -rn "^<<<<<<< \|^=======$\|^>>>>>>> " --include="*.php" --include="*.html" --include="*.js" --include="*.css" --include="*.json" --include="*.yml" application public_html; then
            echo "::error::Merge conflict markers found!"
            exit 1
          fi

      - name: Check for debug statements
        run: |
          if grep -rn "\bvar_dump\b\|\bdd\b\|\bprint_r\b" --include="*.php" application; then
            echo "::warning::Debug statements detected. Please review before deploying."
          fi

      - name: Verify autoload
        run: composer dump-autoload --optimize --strict-psr

      # tests/bootstrap.php нь .env.testing (эсвэл .env) ачаалж, mysql driver
      # үед test database-г CREATE DATABASE-аар бэлддэг (холбогдож чадахгүй бол
      # exit 1). ubuntu-latest runner дээр MySQL суусан (root/root) боловч
      # зогссон байдаг тул асаагаад түүн рүү чиглэсэн .env.testing үүсгэнэ.
      - name: Prepare test environment
        run: |
          sudo systemctl start mysql.service
          cat > .env.testing <<'EOF'
          CODESAUR_APP_NAME=raptor
          CODESAUR_APP_ENV=development
          RAPTOR_DB_DRIVER=mysql
          RAPTOR_DB_HOST=127.0.0.1
          RAPTOR_DB_NAME=raptor_test
          RAPTOR_DB_USERNAME=root
          RAPTOR_DB_PASSWORD=root
          RAPTOR_DB_CHARSET=utf8mb4
          RAPTOR_DB_COLLATION=utf8mb4_unicode_ci
          RAPTOR_JWT_ALGORITHM=HS256
          RAPTOR_JWT_LIFETIME=2592000
          RAPTOR_JWT_SECRET=ci-unit-test-secret-not-used-in-production
          RAPTOR_WAF_BODY_ENCODING=true
          EOF

      - name: Run Unit tests
        run: php vendor/bin/phpunit --testsuite Unit
